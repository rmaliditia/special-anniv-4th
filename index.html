<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>4th Anniversary Special</title>
    <link rel="manifest" href="manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #c42348;
        --primary-light: #e85a7b;
        --bg-color: #fdf0f4;
        --white: #ffffff;
        --text: #333333;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: 0 !important;
      }

      body {
        font-family: "Lato", sans-serif;
        background: linear-gradient(135deg, #ffe6e9 0%, #fdf0f4 100%);
        color: var(--text);
        overflow-x: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      h1,
      h2,
      h3,
      .romantic-text {
        font-family: "Playfair Display", serif;
        color: var(--primary);
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      /* --- GLOBAL UI --- */
      .screen {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        background: linear-gradient(135deg, #ffe6e9 0%, #fdf0f4 100%);
        z-index: 1;
      }
      .screen.active {
        z-index: 10;
      }

      header {
        padding: 15px 20px;
        display: flex;
        align-items: center;
        background: var(--white);
        border-bottom: 2px solid var(--primary);
      }
      .btn-back {
        background: var(--white);
        color: var(--primary);
        border: 2px solid var(--primary);
        padding: 5px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-main {
        background: var(--primary);
        color: var(--white);
        border: none;
        padding: 12px 24px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .header-title {
        flex-grow: 1;
        text-align: center;
        font-size: 1.5rem;
      }

      /* --- MENU UTAMA --- */
      #menu {
        justify-content: center;
        align-items: center;
      }
      #menu h1 {
        font-size: 2.5rem;
        margin-bottom: 40px;
      }
      .menu-container {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .menu-card {
        width: 220px;
        height: 250px;
        background: var(--white);
        border: 3px solid var(--primary);
        display: flex;
        flex-direction: column;
        cursor: pointer;
        box-shadow: 8px 8px 0px rgba(196, 35, 72, 0.2);
        transition: transform 0.1s;
      }
      .menu-card:active {
        transform: translate(4px, 4px);
        box-shadow: 4px 4px 0px rgba(196, 35, 72, 0.2);
      }
      .menu-card .img-placeholder {
        flex-grow: 1;
        background-color: #e0e0e0;
        background-size: cover;
        background-position: center;
      }
      .menu-card .label {
        padding: 15px;
        font-weight: bold;
        color: var(--primary);
        text-align: center;
        border-top: 3px solid var(--primary);
      }

      /* --- WHEEL OF DATE --- */
      .wod-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .challenge-box {
        background: var(--white);
        border: 3px solid var(--primary);
        padding: 40px;
        font-size: 1.5rem;
        text-align: center;
        width: 80%;
        max-width: 800px;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        box-shadow: 10px 10px 0px rgba(196, 35, 72, 0.1);
      }

      /* --- BRAIN CHECK (Memory Match) --- */
      .bc-layout {
        display: flex;
        flex-grow: 1;
        padding: 20px;
        gap: 20px;
        height: calc(100vh - 65px);
      }
      .bc-sidebar {
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .bc-stat-box {
        background: var(--white);
        border: 2px solid var(--primary);
        padding: 15px;
        text-align: center;
      }
      .bc-stat-box .label {
        font-size: 0.9rem;
        color: #666;
      }
      .bc-stat-box .value {
        font-size: 1.8rem;
        font-weight: bold;
        color: var(--primary);
      }
      .bc-grid {
        flex-grow: 1;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 10px;
        min-width: 0;
        min-height: 0;
      }

      /* FIX KARTU BERGESER */
      .card {
        background: var(--primary);
        border: 3px solid var(--white);
        cursor: pointer;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0;
        overflow: hidden;
        background-image: url("card-back.png");
        background-size: cover;
        background-position: center;

        /* TAMBAHAN KUNCI AGAR GRID TIDAK JEBOL */
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        contain: layout size;
      }
      .card.flipped,
      .card.matched {
        background: var(--white);
        background-image: none;
        border-color: var(--primary);
        cursor: default;
      }
      .card img {
        /* Ditarik dari alur agar tidak mendesak ukuran grid kartu */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Modal Pop-Up */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      .modal-box {
        background: var(--bg-color);
        border: 4px solid var(--primary);
        padding: 40px;
        text-align: center;
        max-width: 500px;
      }
      .modal-box h2 {
        font-size: 2rem;
        margin-bottom: 20px;
      }

      /* --- SNAP STUDIO --- */
      .snap-layout {
        display: flex;
        flex-grow: 1;
        height: calc(100vh - 65px);
        background: #222;
        position: relative;
      }

      /* Frame Selection */
      #snap-select {
        display: flex;
        gap: 20px;
        padding: 20px;
        justify-content: center;
        align-items: center;
        width: 100%;
        background: var(--bg-color);
      }
      .frame-option {
        width: 150px;
        height: 266px;
        border: 4px solid #ccc;
        cursor: pointer;
        background: #fff;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .frame-option.selected {
        border-color: var(--primary);
        box-shadow: 0 0 15px var(--primary);
      }
      .frame-nav {
        position: absolute;
        bottom: 30px;
        right: 30px;
      }

      /* Camera View */
      #snap-camera-view {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .camera-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
        border: 2px solid var(--white);
      }
      video,
      #preview-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      #preview-img {
        transform: none;
      }
      #countdown-display {
        position: absolute;
        font-size: 8rem;
        color: white;
        text-shadow: 0 0 20px black;
        font-weight: bold;
      }

      /* Tombol Snap Studio */
      .snap-controls {
        position: absolute;
        right: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 10;
      }
      .btn-icon {
        width: 70px;
        height: 70px;
        background: var(--white);
        border: 3px solid var(--primary);
        color: var(--primary);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Hover efek sederhana untuk tombol SVG */
      .btn-icon:hover,
      .btn-back:hover {
        background: var(--bg-color);
      }

      /* Result Final View */
      #snap-result-view {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-color);
        flex-direction: column;
        gap: 20px;
      }
      #final-canvas {
        height: 80vh;
        max-width: 100%;
        border: 4px solid var(--primary);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!-- ================= MENU UTAMA ================= -->
    <section id="menu" class="screen active">
      <h1 class="romantic-text">Pilih Keseruan Kita!</h1>
      <div class="menu-container">
        <!-- Thumbnail Ditambahkan Lewat Style Background -->
        <div class="menu-card" onclick="nav('wheel-of-date')">
          <div
            class="img-placeholder"
            style="background-image: url(&quot;thumb-wod.jpg&quot;)"
          ></div>
          <div class="label">Wheel of Date</div>
        </div>
        <div class="menu-card" onclick="nav('brain-check')">
          <div
            class="img-placeholder"
            style="background-image: url(&quot;thumb-bc.jpg&quot;)"
          ></div>
          <div class="label">Brain Check</div>
        </div>
        <div class="menu-card" onclick="initSnapStudio()">
          <div
            class="img-placeholder"
            style="background-image: url(&quot;thumb-snap.jpg&quot;)"
          ></div>
          <div class="label">Snap Studio</div>
        </div>
      </div>
    </section>

    <!-- ================= WHEEL OF DATE ================= -->
    <section id="wheel-of-date" class="screen hidden">
      <header>
        <!-- Icon SVG Back -->
        <button class="btn-back" onclick="closeWod()">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2 class="header-title">What's Next?</h2>
      </header>
      <div class="wod-content">
        <div class="challenge-box" id="challenge-text">
          Tekan Spin untuk mendapatkan tantangan!
        </div>
        <button class="btn-main" onclick="spinWheel()">Spin</button>
        <button
          id="btn-back-to-bc"
          class="btn-main hidden"
          style="margin-top: 20px; background: #333"
          onclick="
            nav('brain-check');
            document.getElementById('btn-back-to-bc').classList.add('hidden');
          "
        >
          Main Lagi (Kembali ke Game)
        </button>
      </div>
    </section>

    <!-- ================= BRAIN CHECK ================= -->
    <section id="brain-check" class="screen hidden">
      <header>
        <!-- Icon SVG Back -->
        <button class="btn-back" onclick="nav('menu')">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2 class="header-title">Brain Check</h2>
      </header>
      <div class="bc-layout">
        <div class="bc-sidebar">
          <div class="bc-stat-box">
            <div class="label">Waktu</div>
            <div class="value" id="timer-display">100</div>
          </div>
          <div class="bc-stat-box">
            <div class="label">Pasangan</div>
            <div class="value" id="score-display">0/9</div>
          </div>
          <button
            class="btn-main"
            id="btn-start-bc"
            onclick="startBrainCheck()"
          >
            Mulai
          </button>
          <button
            class="btn-main"
            onclick="resetBrainCheck()"
            style="
              background: var(--white);
              color: var(--primary);
              border: 2px solid var(--primary);
            "
          >
            Ulangi
          </button>
        </div>
        <div class="bc-grid" id="bc-grid">
          <!-- 18 Kartu akan dirender di sini via JS -->
        </div>
      </div>
    </section>

    <!-- Pop-Up Brain Check -->
    <div id="bc-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2 id="bc-modal-title" class="romantic-text">Waktu Habis!</h2>
        <p id="bc-modal-msg" style="margin-bottom: 25px">
          Kamu belum berhasil mencocokkan semuanya.
        </p>
        <button
          id="bc-modal-btn"
          class="btn-main"
          onclick="handleBcModalAction()"
        >
          Putar Spin the Wheel 🎲
        </button>
      </div>
    </div>

    <!-- ================= SNAP STUDIO ================= -->
    <section id="snap-studio" class="screen hidden">
      <header>
        <!-- Icon SVG Back -->
        <button class="btn-back" onclick="nav('menu')">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2 class="header-title">Snap Studio</h2>
      </header>

      <div class="snap-layout">
        <!-- Tahap 1: Pilih Frame -->
        <div id="snap-select">
          <div
            class="frame-option"
            style="background-image: url(&quot;frame-01.png&quot;)"
            onclick="selectFrame(1, this)"
          ></div>
          <div
            class="frame-option"
            style="background-image: url(&quot;frame-02.png&quot;)"
            onclick="selectFrame(2, this)"
          ></div>
          <div
            class="frame-option"
            style="background-image: url(&quot;frame-03.png&quot;)"
            onclick="selectFrame(3, this)"
          ></div>
          <div
            class="frame-option"
            style="background-image: url(&quot;frame-04.png&quot;)"
            onclick="selectFrame(4, this)"
          ></div>
          <div class="frame-nav">
            <button class="btn-main" onclick="openCamera()">
              Selanjutnya ➔
            </button>
          </div>
        </div>

        <!-- Tahap 2 & 3: Layar Kamera & Konfirmasi -->
        <div id="snap-camera-view" class="hidden">
          <div class="camera-wrapper" id="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <img id="preview-img" class="hidden" src="" />
            <div id="countdown-display" class="hidden">5</div>
          </div>

          <!-- Kontrol saat jepret -->
          <div class="snap-controls" id="controls-capture">
            <!-- Icon SVG Camera -->
            <button class="btn-icon" onclick="takeSnap()">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
              </svg>
            </button>
          </div>

          <!-- Kontrol saat konfirmasi -->
          <div class="snap-controls hidden" id="controls-confirm">
            <!-- Icon SVG Ceklis (Bentuk Love dengan Ceklis di dalamnya!) -->
            <button class="btn-icon" onclick="acceptSnap()">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="8 12.5 11 15.5 16 9"></polyline>
              </svg>
            </button>
            <!-- Icon SVG Retake/Ulang (Estetik Tipis) -->
            <button class="btn-icon" onclick="retakeSnap()">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                ></path>
                <path d="M21 3v5h-5"></path>
                <path
                  d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                ></path>
                <path d="M8 16H3v5"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Tahap 4: Hasil Akhir -->
        <div id="snap-result-view" class="hidden">
          <canvas id="final-canvas" width="1080" height="1920"></canvas>
          <div>
            <button class="btn-main" onclick="savePhoto()">Simpan Foto</button>
            <button
              class="btn-main"
              style="
                background: var(--white);
                color: var(--primary);
                margin-left: 10px;
              "
              onclick="initSnapStudio()"
            >
              Buat Baru
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
      function nav(screenId) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active", "hidden"));
        document.querySelectorAll(".screen").forEach((s) => {
          if (s.id !== screenId) s.classList.add("hidden");
        });
        if (screenId === "menu") stopCamera();
      }

      const challenges = [
        "Sebutkan 1 hal pertama yang terlintas di pikiran kamu pas pertama kali ketemu aku 4 tahun lalu!",
        "Di antara semua masakan atau tempat makan yang pernah kita coba berdua, mana yang menurut kamu paling mantap?",
        "Sebutkan 1 kebiasaan kecil aku yang menurut kamu paling gemes atau lucu sampai sekarang.",
        "Kalau kita dikasih uang 10 juta sekarang khusus buat liburan berdua, kamu mau ngajak aku ke mana?",
        "Apa barang atau hadiah pemberian dari aku yang paling sering kamu pakai atau paling kamu suka sampai sekarang?",
        "Sebutkan 1 foto kita berdua dari masa lalu yang paling jadi favorit kamu dan alasannya!",
        "Hal apa yang dulu pas awal-awal jadian bikin kamu paling ragu atau deg-degan pas dekat aku?",
        "Kalau kamu bisa nemuin time machine, kamu mau balik ke momen nge-date kita yang mana?",
        "Suapin aku 1 gigitan makanan disini yang paling enak!",
        "Pegang tangan aku, terus tatap mata aku selama 15 detik tanpa ketawa sama sekali.",
        "Coba tirukan gaya + cara bicara aku pas lagi ngambek/bingung selama 10 detik!",
        "Bikin 1 foto pose paling heboh/konyol pakai HP sekarang!",
        "Bisikkan 3 hal yang paling kamu syukuri dari hubungan kita di telinga aku.",
        "Pijat bahu atau punggung aku selama 2 menit sambil cerita tentang hal seru hari ini.",
        "Senderin kepala kamu di bahu aku selama 1 menit sambil nikmati pemandangan/suasana sekitar.",
        "Puji 3 hal fisik/penampilan aku hari ini dengan gaya yang super lebay/dramatis!",
        "Tulis kalimat 'Happy 4th Anniversary' pakai saus/mayones di atas makanan yang lagi di-BBQ atau piring!",
        "Genggam tangan aku, terus sebutkan 3 alasan kenapa kamu sayang sama aku sampai hari ini!",
        "Kirim 1 voice note romantis/lucu ke obrolan kita sekarang, bilang kalau kamu lagi bahagia banget hari ini.",
        "Pilih 1 barang milik kamu yang dibawa saat piknik ini, lalu 'hadiahkan' ke aku sebagai kenang-kenangan hari ini.",
        "Suapin aku 1 potong daging/makanan BBQ sambil kamu tutup mata!",
        "Puji penampilan atau ketampanan/kecantikan aku dengan gaya pembawa berita TV yang super formal dan serius!",
        "Sandarkan kepala kamu di pundak aku, lalu biarkan aku usap rambut kamu selama 1 menit penuh.",
        "Pegang kedua tangan aku, lalu katakan 'Aku beruntung banget punya kamu' dengan tatapan paling dalam.",
      ];

      let isSpinning = false;
      function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        const box = document.getElementById("challenge-text");
        let count = 0;
        const interval = setInterval(() => {
          box.innerText =
            challenges[Math.floor(Math.random() * challenges.length)];
          count++;
          if (count > 20) {
            clearInterval(interval);
            isSpinning = false;
          }
        }, 100);
      }

      function closeWod() {
        nav("menu");
        document.getElementById("btn-back-to-bc").classList.add("hidden");
      }

      const bcPairsData = [
        { id: 1, type: "img", content: "foto-1.jpg" },
        { id: 2, type: "img", content: "foto-2.jpg" },
        { id: 3, type: "img", content: "foto-3.jpg" },
        { id: 4, type: "img", content: "foto-4.jpg" },
        { id: 5, type: "img", content: "foto-5.jpg" },
        { id: 6, type: "img", content: "foto-6.jpg" },
        { id: 7, type: "img", content: "foto-7.jpg" },
        { id: 8, type: "img", content: "foto-8.jpg" },
        { id: 9, type: "img", content: "foto-9.jpg" },
      ];
      let bcCards = [];
      let flippedCards = [];
      let matchedPairs = 0;
      let bcTimer = null;
      let bcTimeLeft = 100;
      let bcIsPlaying = false;

      function buildBcGrid() {
        bcCards = [];
        bcPairsData.forEach((item) => {
          bcCards.push({ ...item }, { ...item });
        });
        bcCards.sort(() => Math.random() - 0.5);

        const grid = document.getElementById("bc-grid");
        grid.innerHTML = "";
        bcCards.forEach((card, index) => {
          const div = document.createElement("div");
          div.className = "card";
          div.dataset.index = index;
          div.dataset.id = card.id;
          div.onclick = () => flipCard(div, card);
          grid.appendChild(div);
        });
      }

      function startBrainCheck() {
        if (bcIsPlaying) return;
        resetBrainCheck();
        bcIsPlaying = true;
        document.getElementById("btn-start-bc").disabled = true;

        bcTimer = setInterval(() => {
          bcTimeLeft--;
          document.getElementById("timer-display").innerText = bcTimeLeft;
          if (bcTimeLeft <= 0) endGame(false);
        }, 1000);
      }

      function resetBrainCheck() {
        clearInterval(bcTimer);
        bcTimeLeft = 100;
        matchedPairs = 0;
        bcIsPlaying = false;
        flippedCards = [];
        document.getElementById("timer-display").innerText = bcTimeLeft;
        document.getElementById("score-display").innerText = "0/9";
        document.getElementById("btn-start-bc").disabled = false;
        buildBcGrid();
      }

      function flipCard(div, card) {
        if (
          !bcIsPlaying ||
          flippedCards.length >= 2 ||
          div.classList.contains("flipped") ||
          div.classList.contains("matched")
        )
          return;

        div.classList.add("flipped");
        div.innerHTML = `<img src="${card.content}" alt="Memory">`;
        flippedCards.push({ div, id: card.id });

        if (flippedCards.length === 2) {
          setTimeout(checkMatch, 800);
        }
      }

      function checkMatch() {
        const [card1, card2] = flippedCards;
        if (card1.id === card2.id) {
          card1.div.classList.add("matched");
          card2.div.classList.add("matched");
          matchedPairs++;
          document.getElementById("score-display").innerText =
            `${matchedPairs}/9`;
          if (matchedPairs === 9) endGame(true);
        } else {
          card1.div.classList.remove("flipped");
          card1.div.innerHTML = "";
          card2.div.classList.remove("flipped");
          card2.div.innerHTML = "";
        }
        flippedCards = [];
      }

      function endGame(isWin) {
        clearInterval(bcTimer);
        bcIsPlaying = false;
        document.getElementById("btn-start-bc").disabled = false;

        const modal = document.getElementById("bc-modal");
        const title = document.getElementById("bc-modal-title");
        const msg = document.getElementById("bc-modal-msg");
        const btn = document.getElementById("bc-modal-btn");

        if (isWin) {
          title.innerText = "Selamat! 🎉";
          msg.innerText =
            "Kamu berhasil mencocokkan semua memori kita! Happy 4th Anniversary Sayang ❤️";
          btn.innerText = "Tutup";
          btn.onclick = () => modal.classList.add("hidden");
        } else {
          title.innerText = "Waktu Habis!";
          msg.innerText = "Yahh, belum berhasil. Hukuman: Putar Wheel of Date!";
          btn.innerText = "Putar Spin the Wheel 🎲";
          btn.onclick = () => {
            modal.classList.add("hidden");
            nav("wheel-of-date");
            document
              .getElementById("btn-back-to-bc")
              .classList.remove("hidden");
          };
        }
        modal.classList.remove("hidden");
      }

      const frameData = {
        1: {
          src: "frame-01.png",
          poses: 3,
          ratio: 16 / 9,
          coords: [
            { x: 180.96, y: 258.61, w: 717.28, h: 403.47 },
            { x: 180.96, y: 805.77, w: 717.28, h: 403.47 },
            { x: 180.96, y: 1352.77, w: 717.28, h: 403.47 },
          ],
        },
        2: {
          src: "frame-02.png",
          poses: 3,
          ratio: 16 / 9,
          coords: [
            { x: 103, y: 103, w: 873.82, h: 491.46 },
            { x: 103, y: 634.46, w: 873.82, h: 491.46 },
            { x: 103, y: 1165.92, w: 873.82, h: 491.46 },
          ],
        },
        3: {
          src: "frame-03.png",
          poses: 1,
          ratio: 4 / 3,
          coords: [{ x: 63, y: 444.19, w: 954.99, h: 769.16 }],
        },
        4: {
          src: "frame-04.png",
          poses: 3,
          ratio: 4 / 3,
          coords: [
            { x: 194, y: 81, w: 692.58, h: 557.82 },
            { x: 194, y: 680.59, w: 692.58, h: 557.82 },
            { x: 194, y: 1280.18, w: 692.58, h: 557.82 },
          ],
        },
      };

      let activeFrameId = null;
      let stream = null;
      let snapPhotos = [];
      let tempCanvas = document.createElement("canvas");

      function initSnapStudio() {
        nav("snap-studio");
        document.getElementById("snap-select").classList.remove("hidden");
        document.getElementById("snap-camera-view").classList.add("hidden");
        document.getElementById("snap-result-view").classList.add("hidden");
        document
          .querySelectorAll(".frame-option")
          .forEach((el) => el.classList.remove("selected"));
        activeFrameId = null;
        snapPhotos = [];
      }

      function selectFrame(id, element) {
        document
          .querySelectorAll(".frame-option")
          .forEach((el) => el.classList.remove("selected"));
        element.classList.add("selected");
        activeFrameId = id;
      }

      async function openCamera() {
        if (!activeFrameId) {
          alert("Pilih frame terlebih dahulu!");
          return;
        }

        document.getElementById("snap-select").classList.add("hidden");
        document.getElementById("snap-camera-view").classList.remove("hidden");

        const frameInfo = frameData[activeFrameId];
        const wrapper = document.getElementById("camera-wrapper");

        wrapper.style.aspectRatio = frameInfo.ratio;
        wrapper.style.width = "80%";
        wrapper.style.maxHeight = "90%";

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false,
          });
          document.getElementById("webcam").srcObject = stream;
          document.getElementById("webcam").classList.remove("hidden");
          document.getElementById("preview-img").classList.add("hidden");
          resetCameraControls();
        } catch (err) {
          alert("Gagal akses kamera. Izinkan akses di browser.");
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
      }

      function takeSnap() {
        document.getElementById("controls-capture").classList.add("hidden");
        const cdDisplay = document.getElementById("countdown-display");
        cdDisplay.classList.remove("hidden");

        let count = 5;
        cdDisplay.innerText = count;
        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            cdDisplay.innerText = count;
          } else {
            clearInterval(timer);
            cdDisplay.classList.add("hidden");
            captureFrame();
          }
        }, 1000);
      }

      function captureFrame() {
        const video = document.getElementById("webcam");
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const ctx = tempCanvas.getContext("2d");

        ctx.translate(tempCanvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

        const dataUrl = tempCanvas.toDataURL("image/jpeg");

        video.classList.add("hidden");
        const preview = document.getElementById("preview-img");
        preview.src = dataUrl;
        preview.classList.remove("hidden");

        document.getElementById("controls-confirm").classList.remove("hidden");
      }

      function retakeSnap() {
        document.getElementById("preview-img").classList.add("hidden");
        document.getElementById("webcam").classList.remove("hidden");
        resetCameraControls();
      }

      function acceptSnap() {
        snapPhotos.push(document.getElementById("preview-img").src);
        const limit = frameData[activeFrameId].poses;

        if (snapPhotos.length >= limit) {
          generateFinalPhoto();
        } else {
          retakeSnap();
        }
      }

      function resetCameraControls() {
        document.getElementById("controls-capture").classList.remove("hidden");
        document.getElementById("controls-confirm").classList.add("hidden");
      }

      function generateFinalPhoto() {
        stopCamera();
        document.getElementById("snap-camera-view").classList.add("hidden");
        document.getElementById("snap-result-view").classList.remove("hidden");

        const canvas = document.getElementById("final-canvas");
        const ctx = canvas.getContext("2d");
        const config = frameData[activeFrameId];

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let loadedPhotos = 0;
        snapPhotos.forEach((src, idx) => {
          const img = new Image();
          img.onload = () => {
            const c = config.coords[idx];
            ctx.drawImage(img, c.x, c.y, c.w, c.h);

            loadedPhotos++;
            if (loadedPhotos === config.poses) {
              const frameImg = new Image();
              frameImg.onload = () => {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
              };
              frameImg.src = config.src;
            }
          };
          img.src = src;
        });
      }

      function savePhoto() {
        const canvas = document.getElementById("final-canvas");
        const link = document.createElement("a");
        link.download = `Anniversary-Photobox-${new Date().getTime()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      buildBcGrid();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
